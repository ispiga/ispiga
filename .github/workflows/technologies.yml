name: Generate Technologies GIF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-technologies:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cairosvg

      - name: Generate Technologies GIF
        run: |
          python scripts/generate_technologies.py

      - name: Check generated GIF
        run: |
          ls -lh assets/technologies.gif

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/technologies.gif

          git diff --cached --quiet || git commit -m "Update technologies animation"

          git push
