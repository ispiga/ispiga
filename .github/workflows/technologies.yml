name: Generate Technologies GIF

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  technologies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cairosvg
          sudo apt-get update
          sudo apt-get install -y gifsicle

      - name: Generate Technologies GIFs
        run: |
          python generate_technologies.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/technologies-dark.gif
          git add assets/technologies-light.gif

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update technologies animations"
            git push
          fi
