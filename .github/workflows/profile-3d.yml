name: GitHub Profile 3D

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    name: Generate GitHub Profile 3D

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate dark 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      - name: Rename dark profile
        run: |
          mv profile-custom-gitblock.svg profile-custom-gitblock-dark.svg

      - name: Generate light 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings-light.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .

          if git commit -m "chore: update 3D contribution profiles"; then
            git push
          fi
